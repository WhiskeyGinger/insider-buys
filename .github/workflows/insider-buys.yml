name: Insider buys
on:
  schedule:
    - cron: "17 12-23 * * 1-5"   # hourly, weekdays, ~7am–6pm Central
  workflow_dispatch:
    inputs:
      mode:
        description: run, sample, or probe
        default: run
permissions:
  contents: write
concurrency: { group: insider-buys, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest
      - uses: actions/cache/restore@v4
        with:
          path: .state
          key: insider-state-${{ github.run_id }}
          restore-keys: insider-state-
      - name: Scan SEC Form 4 filings
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT || vars.SEC_CONTACT }}
          MIN_VALUE: ${{ vars.MIN_VALUE || '100000' }}
          MODE: ${{ inputs.mode || 'run' }}
        run: python insiders.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .state
          key: insider-state-${{ github.run_id }}
      - name: Publish weekly-recap data
        if: success() && (inputs.mode || 'run') == 'run'
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -f recap.json ] || exit 0
          curl -sf https://raw.githubusercontent.com/${{ github.repository }}/data/recap.json -o /tmp/old.json || true
          cmp -s recap.json /tmp/old.json && { echo "recap data unchanged"; exit 0; }
          d=$(mktemp -d); cp recap.json "$d"/; cd "$d"
          git init -q -b data && git add recap.json
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "Update weekly recap data"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" data
